name: Publish staged firmware

on:
  push:
    branches:
      - "publish/**"
    paths:
      - ".publisher/**"

permissions:
  contents: write

concurrency:
  group: firmware-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged payload
        uses: actions/checkout@v4
        with:
          path: incoming

      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repository

      - name: Validate and publish payload
        run: |
          python3 repository/tools/publish_staged_firmware.py \
            --staging incoming/.publisher/release \
            --repository repository

      - name: Commit production release
        working-directory: repository
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish firmware from ${RELEASE_VERSION}"
          git push origin HEAD:main
